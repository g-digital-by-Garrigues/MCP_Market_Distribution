name: "Publish to Smithery"
description: "Uploads the generated .mcpb bundle to Smithery via `smithery mcp publish`. Replaces the v1.0 repo-auto-deploy polling flow (Smithery retired that model in 2026)."

inputs:
  mcp_name:
    description: "Pipeline-internal MCP id (kebab-case). Used in the qualified Smithery name <namespace>/<mcp_name>."
    required: true
  version:
    description: "Semver to publish."
    required: true
  pipeline_run_id:
    description: "Run correlation id from the setup job."
    required: true
  dry_run:
    description: "When 'true', validates the bundle exists but skips the Smithery upload."
    required: false
    default: "false"
  bundle_artifact_name:
    description: "Name of the workflow artifact that carries the .mcpb bundle (uploaded by generate-mcpb-bundle in Story 5.12)."
    required: true
  bundle_file_name:
    description: "Filename of the .mcpb inside the downloaded artifact, e.g. ead-factory-v1.0.7.mcpb. Defaults to <mcp_name>-v<version>.mcpb."
    required: false
    default: ""
  smithery_namespace:
    description: "Smithery org namespace. Defaults to g-digital-by-Garrigues."
    required: false
    default: "g-digital-by-Garrigues"
  smithery_token:
    description: "SMITHERY_TOKEN secret (service token with publish scope on the namespace). Required for non-dry-run."
    required: false
    default: ""

outputs:
  result_json:
    description: "PublisherOutputSchema-conforming JSON."
    value: ${{ steps.publish.outputs.result_json }}

runs:
  using: "composite"
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.0

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install pipeline dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Download bundle artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.bundle_artifact_name }}
        path: ./_bundle

    - name: Resolve bundle path
      id: resolve_bundle
      shell: bash
      env:
        MCP_NAME: ${{ inputs.mcp_name }}
        VERSION: ${{ inputs.version }}
        EXPLICIT_FILE: ${{ inputs.bundle_file_name }}
      run: |
        set -euo pipefail
        if [ -n "$EXPLICIT_FILE" ]; then
          BUNDLE_FILE="$EXPLICIT_FILE"
        else
          BUNDLE_FILE="${MCP_NAME}-v${VERSION}.mcpb"
        fi
        BUNDLE_PATH="$(pwd)/_bundle/${BUNDLE_FILE}"
        if [ ! -f "$BUNDLE_PATH" ]; then
          echo "::error::Resolved bundle path does not exist: $BUNDLE_PATH"
          ls -la _bundle || true
          exit 1
        fi
        echo "bundle_path=$BUNDLE_PATH" >> "$GITHUB_OUTPUT"

    - name: Publish via composite action
      id: publish
      shell: bash
      env:
        INPUT_MCP_NAME: ${{ inputs.mcp_name }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PIPELINE_RUN_ID: ${{ inputs.pipeline_run_id }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_BUNDLE_PATH: ${{ steps.resolve_bundle.outputs.bundle_path }}
        INPUT_SMITHERY_NAMESPACE: ${{ inputs.smithery_namespace }}
        SMITHERY_TOKEN: ${{ inputs.smithery_token }}
      run: |
        # See actions/publish-npm/action.yml for the rationale on actively
        # disabling errexit with `+e`: we want result.json to reach
        # GITHUB_OUTPUT even when the publisher returns status='failed'
        # (exit 1).
        set +e -uo pipefail
        pnpm tsx src/publishers/run-publish-smithery.ts > result.json
        exit_code=$?
        printf 'result_json<<EOF\n' >> "$GITHUB_OUTPUT"
        cat result.json >> "$GITHUB_OUTPUT"
        printf 'EOF\n' >> "$GITHUB_OUTPUT"
        cat result.json
        exit $exit_code

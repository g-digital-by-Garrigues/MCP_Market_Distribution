name: "Publish to Cline Marketplace"
description: "Files an issue on cline/mcp-marketplace with the submission body + logo + install snippets. Idempotent via existing-issue search."

inputs:
  mcp_name:
    description: "Pipeline-internal MCP id."
    required: true
  version:
    description: "Semver."
    required: true
  pipeline_run_id:
    description: "Run correlation id."
    required: true
  dry_run:
    description: "When 'true', skips issue creation."
    required: false
    default: "false"

outputs:
  result_json:
    description: "PublisherOutputSchema-conforming JSON; target_url is the issue URL when status=succeeded/skipped."
    value: ${{ steps.publish.outputs.result_json }}

runs:
  using: "composite"
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.0

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install pipeline dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: File Cline Marketplace issue
      id: publish
      shell: bash
      env:
        INPUT_MCP_NAME: ${{ inputs.mcp_name }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PIPELINE_RUN_ID: ${{ inputs.pipeline_run_id }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        BOT_PAT: ${{ env.BOT_PAT }}
      run: |
        set -uo pipefail
        pnpm tsx src/publishers/run-publish-cline.ts > result.json
        exit_code=$?
        printf 'result_json<<EOF\n' >> "$GITHUB_OUTPUT"
        cat result.json >> "$GITHUB_OUTPUT"
        printf 'EOF\n' >> "$GITHUB_OUTPUT"
        cat result.json
        exit $exit_code

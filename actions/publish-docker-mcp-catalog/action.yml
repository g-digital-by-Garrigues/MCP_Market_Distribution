name: "Publish to Docker MCP Catalog"
description: "Opens a PR against docker/mcp-registry adding servers/<mcp_name>/{server.yaml,tools.json,readme.md}. Idempotent via existing-PR search."

inputs:
  mcp_name:
    description: "Pipeline-internal MCP id."
    required: true
  version:
    description: "Semver to submit."
    required: true
  pipeline_run_id:
    description: "Run correlation id."
    required: true
  dry_run:
    description: "When 'true', skips fork/branch/push/PR. Idempotency check still runs."
    required: false
    default: "false"

outputs:
  result_json:
    description: "PublisherOutputSchema-conforming JSON; target_url is the PR URL when status=succeeded/skipped."
    value: ${{ steps.publish.outputs.result_json }}

runs:
  using: "composite"
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.0

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install pipeline dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Open PR to docker/mcp-registry
      id: publish
      shell: bash
      env:
        INPUT_MCP_NAME: ${{ inputs.mcp_name }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PIPELINE_RUN_ID: ${{ inputs.pipeline_run_id }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        BOT_PAT: ${{ env.BOT_PAT }}
      run: |
        set -euo pipefail
        pnpm tsx src/publishers/run-publish-docker-mcp-catalog.ts > result.json
        printf 'result_json<<EOF\n' >> "$GITHUB_OUTPUT"
        cat result.json >> "$GITHUB_OUTPUT"
        printf 'EOF\n' >> "$GITHUB_OUTPUT"
        cat result.json

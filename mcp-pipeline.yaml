# Per-MCP configuration registry — the pipeline's "API for engineers" (FR2)
# Schema validated by src/schemas/mcp-pipeline-config.schema.ts (Story 1.2)
# pipeline_version: tracks pipeline schema evolution; bumped when fields are added/removed
pipeline_version: 1

# Pinned ecosystem schema versions (NFR-I4)
mcp_schema_version: "2025-12-11"
n8n_node_api_version: "1.0"  # to be confirmed against n8n's current schema during Story 5.1

# One entry per MCP processed by the pipeline.
# Each entry under `mcps:` is keyed by the MCP's kebab-case folder name
# (which must match the folder under pending-to-publish/<key>/).
mcps:
  # EAD Factory MCP — the first MCP through the pipeline.
  # The MCP server itself is "EAD Factory"; it bundles two Claude Code skills
  # (create-internal-evidence and create-signature-request) that consume the
  # Evidence Manager and Signature Manager APIs respectively.
  ead-factory:
    # Identity
    reverse_dns_name: "io.github.g-digital-by-Garrigues/ead-factory"
    npm_scope: "@g-digital"
    npm_package_name: "@g-digital/mcp-ead-factory"
    docker_image_name: "gdigital/ead-factory"

    # Track B
    n8n_adapter_target_name: "n8n-node-ead-factory"  # → @g-digital/n8n-node-ead-factory

    # License (FR14 Layer 1 validates this)
    license: "MIT"

    # Consumer-facing
    credential_help_url: "https://eadtrust.example.com/onboarding"  # PLACEHOLDER — update once EADTrust team confirms (task #16 in human-setup-runbook)

    # Per-target overrides (optional — empty = use pipeline defaults)
    target_overrides: {}

    # Track A targets — must include all 7 v1 stores or use 'default' for full coverage
    track_a_targets: default

    # Track B targets
    track_b_targets:
      - n8n
      - make-rom

    # Git tag prefix the CI publish workflow matches against pushed v* tags
    # (Story 2.1). Default 'v' is fine for single-MCP repos; when this repo
    # later hosts more than one MCP, switch each entry to a per-MCP prefix
    # like 'ead-factory-v' so the workflow can disambiguate which MCP a
    # pushed tag belongs to.
    git_tag_prefix: "v"

    # Logo asset path (FR45) — relative to pending-to-publish/<key>/
    logo_path: "assets/logo-400x400.png"

    # Bundled Claude Code skills (FR45) — paths relative to pending-to-publish/<key>/.
    # These two skills are NOT separate MCPs; they're consumer-facing shortcuts the
    # EAD Factory MCP ships so installers get usable workflows out of the box.
    bundled_skills:
      - .claude/commands/create-internal-evidence.md  # consumes Evidence Manager API
      - .claude/commands/create-signature-request.md  # consumes Signature Manager API

# MCP registry — the pipeline's "API for engineers" (FR2).
#
# In the v1.1 per-MCP-repo model, each entry's only required field is
# `repo_url` (the HTTPS URL of the MCP's own public source repo). All
# other per-MCP fields — npm scope, docker image name, license, tools
# list, etc. — live in that repo's `.distribution.yaml` (schema:
# src/schemas/distribution-config.schema.ts). The pipeline clones the
# MCP source into pending-to-publish/<id>/ at workflow time via
# actions/checkout-mcp-source/action.yml.
#
# Root schema: src/schemas/mcp-pipeline-config.schema.ts.
#
# pipeline_version: tracks pipeline schema evolution; bumped when fields
# are added/removed at the registry level.
pipeline_version: 1

# Pinned ecosystem schema versions (NFR-I4)
mcp_schema_version: "2025-12-11"
n8n_node_api_version: "1.0"  # to be confirmed against n8n's current schema during Story 5.1

# One entry per MCP processed by the pipeline. Each key is the MCP's
# kebab-case id, which also names the folder under pending-to-publish/<key>/
# where the source repo is cloned.
mcps:
  # EAD Factory MCP — the first MCP through the pipeline.
  # Source: https://github.com/g-digital-by-Garrigues/EAD-Factory-MCP
  # Per-MCP publish config (npm scope, docker image, tools list, etc.)
  # lives in that repo's .distribution.yaml.
  ead-factory:
    repo_url: "https://github.com/g-digital-by-Garrigues/EAD-Factory-MCP"

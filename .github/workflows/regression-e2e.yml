name: regression-e2e

# Story 8.3: E2E regression test for pipeline changes.
#
# On every PR to main, run a DRY-RUN publish flow against each of the 3
# portfolio MCPs. If the pipeline change in the PR breaks any MCP's
# release path, we catch it at review time — not at the next live tag
# push.
#
# What this catches (after merge, on the next live PR or via manual dispatch):
#   ✓ Story 8.1 + 8.2 coherence checks against each MCP's current source
#   ✓ Gate / publisher composite-action interaction with each MCP
#   ✓ Idempotency behaviour across all 7 v1 stores
#
# What this does NOT catch (intentional limitation):
#   ✗ Pipeline changes BEFORE merge. We use the cross-repo `@main`
#     reference for the reusable workflow (the local `./` syntax causes
#     GitHub startup_failure for reasons we have not isolated yet —
#     see PR #143 + PR #144 debugging) so the regression sweep always
#     runs against whatever publish.yml is on main. PR-pre-merge
#     validation against the candidate pipeline code is therefore not
#     possible with this workflow as-is; that's a future enhancement.
#   ✗ TypeScript code changes inside src/: same reason. The unit-test
#     suite covers these.
#
# Resource cost: a full dry-run touches 25+ jobs per MCP × 3 MCPs. Path
# filters skip doc-only PRs so we don't burn CI on every README tweak.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '_bmad-output/**'
      - '_bmad/**'
      - '.gitignore'
      - 'LICENSE'
  # Also exposed via workflow_dispatch so maintainers can run the
  # regression sweep on demand (e.g., to verify a previous PR's effect
  # before the next live release, or to debug regression-e2e itself).
  workflow_dispatch:

# Concurrency: cancel any prior regression run for the same PR — if the
# PR author force-pushes, the stale run becomes uninteresting fast.
concurrency:
  group: regression-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write       # publish.yml's final-report needs this
  id-token: write       # publish.yml's OIDC publishers need this (even in dry-run)
  pull-requests: write  # publish.yml's PR comments need this
  # NOTE: `actions: write` is intentionally NOT requested here. GitHub
  # Actions rejects pull_request workflows that request actions:write
  # at workflow startup (startup_failure with no log). publish.yml's
  # internal workflow_dispatch calls are not exercised in dry-run mode,
  # so dropping this permission is safe for the regression-e2e use case.
  # If a future dry-run path needs it, gate the relevant publish.yml
  # step on `dry_run != 'true'` rather than re-adding the permission here.

jobs:
  ead-factory:
    name: Regression E2E — ead-factory
    uses: g-digital-by-Garrigues/MCP_Market_Distribution/.github/workflows/publish.yml@main
    with:
      mcp_name: ead-factory
      # Pin a known-good current version. Re-pinning is a deliberate
      # maintenance step when each MCP releases — the alternative
      # (auto-detecting the latest version) adds complexity without a
      # clear win. The dry-run is idempotent against an existing
      # version, so a stale pin still works (just less informative).
      version: "1.0.12"
      step: all
      track: both
      dry_run: true
    secrets: inherit

  ead-enterprise-suite:
    name: Regression E2E — ead-enterprise-suite
    uses: g-digital-by-Garrigues/MCP_Market_Distribution/.github/workflows/publish.yml@main
    with:
      mcp_name: ead-enterprise-suite
      version: "1.1.1"
      step: all
      track: both
      dry_run: true
    secrets: inherit

  gocertius:
    name: Regression E2E — gocertius
    uses: g-digital-by-Garrigues/MCP_Market_Distribution/.github/workflows/publish.yml@main
    with:
      mcp_name: gocertius
      version: "1.0.0"
      step: all
      track: both
      dry_run: true
    secrets: inherit

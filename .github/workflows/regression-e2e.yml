name: regression-e2e

# Story 8.3: E2E regression test for pipeline changes.
#
# On every PR to main, run a DRY-RUN publish flow against each of the 3
# portfolio MCPs. If the pipeline change in the PR breaks any MCP's
# release path, we catch it at review time — not at the next live tag
# push.
#
# What this catches (after merge, on the next live PR or via manual dispatch):
#   ✓ Story 8.1 + 8.2 coherence checks against each MCP's current source
#   ✓ Gate / publisher composite-action interaction with each MCP
#   ✓ Idempotency behaviour across all 7 v1 stores
#
# What this does NOT catch (intentional limitation):
#   ✗ Pipeline changes BEFORE merge. We use the cross-repo `@main`
#     reference for the reusable workflow so the regression sweep always
#     runs against whatever publish.yml is on main. PR-pre-merge
#     validation against the candidate pipeline code is therefore not
#     possible with this workflow as-is; that's a future enhancement.
#   ✗ TypeScript code changes inside src/: same reason. The unit-test
#     suite covers these.
#
# Prerequisite (Settings → Actions → General → Actions permissions):
#   MCP_Market_Distribution must be set to "Allow all actions and
#   reusable workflows" (or the allowlist variant including actions/*,
#   pnpm/action-setup@*, docker/*). The restrictive default ("Allow
#   g-digital-by-Garrigues actions only") blocks publish.yml's standard
#   actions when invoked from this repo's own context — startup_failure
#   with the message "actions ... are not allowed in MCP_Market_Distribution".
#   Source MCP repos already have the permissive setting, which is why
#   their workflow_call to publish.yml works. Debugged across runs
#   #26441851885, #26441985197, #26442070424, #26442134177 before the
#   GitHub UI surfaced the actual error.
#
# Resource cost: a full dry-run touches 25+ jobs per MCP × 3 MCPs. Path
# filters skip doc-only PRs so we don't burn CI on every README tweak.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '_bmad-output/**'
      - '_bmad/**'
      - '.gitignore'
      - 'LICENSE'
  # Also exposed via workflow_dispatch so maintainers can run the
  # regression sweep on demand (e.g., to verify a previous PR's effect
  # before the next live release, or to debug regression-e2e itself).
  workflow_dispatch:

# Concurrency: cancel any prior regression run for the same ref — if a
# PR author force-pushes, the stale run becomes uninteresting fast.
# Uses github.ref so the group is well-defined for both pull_request
# events (refs/pull/<n>/merge) and workflow_dispatch (refs/heads/<branch>).
# An empty pull_request.number on workflow_dispatch caused our previous
# startup_failure runs (#26441851885, #26441985197).
concurrency:
  group: regression-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write       # publish.yml's final-report needs this
  id-token: write       # publish.yml's OIDC publishers need this (even in dry-run)
  pull-requests: write  # publish.yml's PR comments need this
  # NOTE: `actions: write` is intentionally NOT requested here. GitHub
  # Actions rejects pull_request workflows that request actions:write
  # at workflow startup (startup_failure with no log). publish.yml's
  # internal workflow_dispatch calls are not exercised in dry-run mode,
  # so dropping this permission is safe for the regression-e2e use case.
  # If a future dry-run path needs it, gate the relevant publish.yml
  # step on `dry_run != 'true'` rather than re-adding the permission here.

jobs:
  # Resolve each source MCP's CURRENT version straight from its repo @ main,
  # instead of a hardcoded pin. A dry-run clones the source @ main (see
  # publish.yml "Resolve MCP source repo": dry_run ⇒ REPO_REF="main"), so the
  # ONLY version that can be internally coherent with that snapshot is the one
  # main itself declares. The old hardcoded pins (1.0.12 / 1.0.0 / 1.0.0) went
  # stale the moment any MCP released, and the coherence gate (Story 8.1) then
  # failed every PR — training reviewers to ignore a red X. Resolving from main
  # keeps the gate's real value (it still catches an INTERNALLY incoherent
  # snapshot: package.json bumped but server.json not — the ead-es v1.1.0 bug)
  # while removing the false positive. Publishing paths are untouched: real
  # releases still resolve version from the pushed tag in publish.yml.
  resolve-versions:
    name: Resolve source @ main versions
    runs-on: ubuntu-latest
    outputs:
      ead_factory: ${{ steps.v.outputs.ead_factory }}
      ead_enterprise_suite: ${{ steps.v.outputs.ead_enterprise_suite }}
      gocertius: ${{ steps.v.outputs.gocertius }}
    steps:
      - id: v
        env:
          # Same credential the pipeline already uses to clone the sources
          # (actions/checkout-mcp-source). public_repo scope is enough.
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          set -euo pipefail
          declare -A repos=(
            [ead_factory]=EAD-Factory-MCP
            [ead_enterprise_suite]=EAD_Enterprise_Suite_MCP
            [gocertius]=GoCertius_MCP
          )
          for key in "${!repos[@]}"; do
            repo="${repos[$key]}"
            ver=$(gh api "repos/g-digital-by-Garrigues/${repo}/contents/package.json?ref=main" \
              -H "Accept: application/vnd.github.raw" \
              | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            if [ -z "$ver" ] || [ "$ver" = "undefined" ]; then
              echo "::error::could not read ${repo}@main package.json#version"
              exit 1
            fi
            echo "${key}=${ver}" >> "$GITHUB_OUTPUT"
            echo "resolved ${key} (${repo}@main) = ${ver}"
          done

  ead-factory:
    name: Regression E2E — ead-factory
    needs: resolve-versions
    uses: g-digital-by-Garrigues/MCP_Market_Distribution/.github/workflows/publish.yml@main
    with:
      mcp_name: ead-factory
      version: ${{ needs.resolve-versions.outputs.ead_factory }}
      step: all
      track: both
      dry_run: true
    secrets: inherit

  ead-enterprise-suite:
    name: Regression E2E — ead-enterprise-suite
    needs: resolve-versions
    uses: g-digital-by-Garrigues/MCP_Market_Distribution/.github/workflows/publish.yml@main
    with:
      mcp_name: ead-enterprise-suite
      version: ${{ needs.resolve-versions.outputs.ead_enterprise_suite }}
      step: all
      track: both
      dry_run: true
    secrets: inherit

  gocertius:
    name: Regression E2E — gocertius
    needs: resolve-versions
    uses: g-digital-by-Garrigues/MCP_Market_Distribution/.github/workflows/publish.yml@main
    with:
      mcp_name: gocertius
      version: ${{ needs.resolve-versions.outputs.gocertius }}
      step: all
      track: both
      dry_run: true
    secrets: inherit

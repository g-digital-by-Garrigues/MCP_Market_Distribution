name: regression-e2e-minimal

# Minimum reproducer for the regression-e2e startup_failure.
# If this works, the bug is in regression-e2e.yml's structure (concurrency,
# multi-job, etc.). If this fails too, MCP_Market_Distribution can't call
# its own publish.yml at all and we need a different architectural approach.

on:
  workflow_dispatch:

jobs:
  one-call:
    uses: g-digital-by-Garrigues/MCP_Market_Distribution/.github/workflows/publish.yml@main
    with:
      mcp_name: ead-factory
      version: "1.0.12"
      step: all
      track: both
      dry_run: true
    secrets: inherit

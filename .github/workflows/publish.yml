name: publish

# Triggered by:
#   1. Engineer pushes a v* tag created by /prep-mcp (Story 1.11), or
#   2. Engineer manually dispatches from the Actions UI for re-runs and dry-runs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mcp_name:
        description: "MCP name (kebab-case key in mcp-pipeline.yaml#mcps)"
        required: true
        type: string
      version:
        description: "Semver to publish (e.g., 1.0.0)"
        required: true
        type: string
      step:
        description: "Which pipeline step to run"
        required: false
        type: choice
        options:
          - gate
          - publish
          - all
        default: all
      track:
        description: "Track(s) to run"
        required: false
        type: choice
        options:
          - a
          - b
          - both
        default: both
      bump:
        description: "Optional explicit bump override (empty = derive from commits)"
        required: false
        type: choice
        options:
          - ""
          - patch
          - minor
          - major
        default: ""
      dry_run:
        description: "Dry-run mode (skip actual publish actions)"
        required: false
        type: boolean
        default: false

# `cancel-in-progress: false` is deliberate: a publish in flight must not be
# pre-empted by a follow-up tag — we'd rather queue and process serially per
# (mcp_name, version) tuple. For tag pushes the group falls back to the tag
# name itself (which is already unique per release), so two unrelated tag
# pushes don't block each other.
concurrency:
  group: publish-${{ inputs.mcp_name || github.ref_name }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve context + verify build
    runs-on: ubuntu-latest
    outputs:
      mcp_name: ${{ steps.resolve.outputs.mcp_name }}
      version: ${{ steps.resolve.outputs.version }}
      pipeline_run_id: ${{ steps.resolve.outputs.pipeline_run_id }}
      source: ${{ steps.resolve.outputs.source }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve workflow context
        id: resolve
        env:
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          INPUT_MCP_NAME: ${{ inputs.mcp_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          pnpm tsx src/ci/resolve-workflow-context.ts > resolved.json
          mcp_name=$(node -p "JSON.parse(require('fs').readFileSync('resolved.json','utf8')).mcp_name")
          version=$(node -p "JSON.parse(require('fs').readFileSync('resolved.json','utf8')).version")
          pipeline_run_id=$(node -p "JSON.parse(require('fs').readFileSync('resolved.json','utf8')).pipeline_run_id")
          source=$(node -p "JSON.parse(require('fs').readFileSync('resolved.json','utf8')).source")
          # Tag pushes never carry a dry_run input; fall back to "false" so
          # downstream publishers can treat this output as a stable boolean.
          dry_run_raw="${INPUT_DRY_RUN:-false}"
          case "$(printf '%s' "$dry_run_raw" | tr '[:upper:]' '[:lower:]')" in
            true|1|yes) dry_run=true ;;
            *) dry_run=false ;;
          esac
          echo "mcp_name=$mcp_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pipeline_run_id=$pipeline_run_id" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          {
            echo "## Resolved context"
            echo "- mcp_name: \`$mcp_name\`"
            echo "- version: \`$version\`"
            echo "- pipeline_run_id: \`$pipeline_run_id\`"
            echo "- source: \`$source\`"
            echo "- dry_run: \`${{ inputs.dry_run }}\`"
            echo "- step: \`${{ inputs.step || 'all' }}\`"
            echo "- track: \`${{ inputs.track || 'both' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the build still compiles on the runner
        run: pnpm run typecheck && pnpm run test

  nfr-s3-audit:
    name: NFR-S3 audit (no consumer credentials in CI)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run consumer-credentials audit
        run: pnpm tsx src/ci/audit-consumer-credentials.ts

  track-a-layer-1:
    name: Track A — Layer 1 (static validation)
    needs: setup
    runs-on: ubuntu-latest
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Track A Layer 1 gate
        run: |
          set -euo pipefail
          pnpm tsx src/gates/run-track-a-layer-1.ts "${{ needs.setup.outputs.mcp_name }}" \
            | tee gate-layer-1.json

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-layer-1-report
          path: gate-layer-1.json
          if-no-files-found: warn

  track-a-layer-2:
    name: Track A — Layer 2 (MCP protocol smoke test)
    needs: [setup, track-a-layer-1]
    runs-on: ubuntu-latest
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pipeline dependencies
        run: pnpm install --frozen-lockfile

      - name: Install + build the MCP source
        working-directory: pending-to-publish/${{ needs.setup.outputs.mcp_name }}
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npm run build

      - name: Run Track A Layer 2 gate
        run: |
          set -euo pipefail
          pnpm tsx src/gates/run-track-a-layer-2.ts "${{ needs.setup.outputs.mcp_name }}" \
            | tee gate-layer-2.json

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-layer-2-report
          path: gate-layer-2.json
          if-no-files-found: warn

  track-a-layer-3:
    name: Track A — Layer 3 (build & install)
    needs: [setup, track-a-layer-2]
    runs-on: ubuntu-latest
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (for BuildKit + layer caching)
        uses: docker/setup-buildx-action@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pipeline dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Track A Layer 3 gate
        run: |
          set -euo pipefail
          pnpm tsx src/gates/run-track-a-layer-3.ts "${{ needs.setup.outputs.mcp_name }}" \
            | tee gate-layer-3.json

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-layer-3-report
          path: gate-layer-3.json
          if-no-files-found: warn

  gate-failure-summary:
    name: Gate failure summary (aggregate + PR comment)
    needs: [setup, track-a-layer-1, track-a-layer-2, track-a-layer-3]
    if: >-
      always() &&
      (needs.track-a-layer-1.result == 'failure' ||
       needs.track-a-layer-2.result == 'failure' ||
       needs.track-a-layer-3.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pipeline dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Layer 1 report
        if: needs.track-a-layer-1.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: track-a-layer-1-report
          path: reports/layer-1
        continue-on-error: true

      - name: Download Layer 2 report
        if: needs.track-a-layer-2.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: track-a-layer-2-report
          path: reports/layer-2
        continue-on-error: true

      - name: Download Layer 3 report
        if: needs.track-a-layer-3.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: track-a-layer-3-report
          path: reports/layer-3
        continue-on-error: true

      - name: Aggregate error reports
        run: |
          set -euo pipefail
          reports=()
          for f in reports/layer-1/gate-layer-1.json reports/layer-2/gate-layer-2.json reports/layer-3/gate-layer-3.json; do
            if [ -f "$f" ]; then reports+=("$f"); fi
          done
          if [ ${#reports[@]} -eq 0 ]; then
            echo '{"pipeline_run_id":"'"$PIPELINE_RUN_ID"'","mcpName":null,"has_failures":true,"source_reports":[],"errors":[]}' > error-report.json
          else
            pnpm tsx src/ci/aggregate-error-reports.ts "${reports[@]}" --pipeline-run-id "$PIPELINE_RUN_ID" > error-report.json
          fi
          cp error-report.json "error-report-${PIPELINE_RUN_ID}.json"

      - name: Render markdown comment body
        env:
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          pnpm tsx src/ci/render-error-report-markdown.ts error-report.json --workflow-run-url "$WORKFLOW_RUN_URL" > error-report.md

      - name: Upload aggregated error report
        uses: actions/upload-artifact@v4
        with:
          name: error-report-${{ env.PIPELINE_RUN_ID }}
          path: error-report-${{ env.PIPELINE_RUN_ID }}.json
          if-no-files-found: error

      - name: Post or update PR comment
        uses: actions/github-script@v7
        env:
          PIPELINE_RUN_ID: ${{ env.PIPELINE_RUN_ID }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('error-report.md', 'utf8');
            const marker = `<!-- error-report:${process.env.PIPELINE_RUN_ID} -->`;

            // Find the PR(s) associated with the commit that produced this run.
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pr = prs[0];
            if (!pr) {
              core.notice('No PR associated with this commit; error-report posted only as artifact.');
              core.summary.addRaw(body).write();
              return;
            }

            // Update an existing comment with the same marker, otherwise create one.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.notice(`Updated existing error-report comment on PR #${pr.number}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
              core.notice(`Posted error-report comment on PR #${pr.number}.`);
            }
            core.summary.addRaw(body).write();

  # ---------------------------------------------------------------------
  # Track A core publishers (Stories 3.2 / 3.3 / 3.4)
  # ---------------------------------------------------------------------

  publish-npm:
    name: Publish to npm
    needs: [setup, track-a-layer-3]
    if: needs.track-a-layer-3.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # id-token: write enables the OIDC trusted-publisher path. NPM_TOKEN
      # still takes precedence when set (Story 3.2's first-publish path).
      contents: read
      id-token: write
    outputs:
      result_json: ${{ steps.publish.outputs.result_json }}
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish via composite action
        id: publish
        uses: ./actions/publish-npm
        with:
          mcp_name: ${{ needs.setup.outputs.mcp_name }}
          version: ${{ needs.setup.outputs.version }}
          pipeline_run_id: ${{ needs.setup.outputs.pipeline_run_id }}
          dry_run: ${{ needs.setup.outputs.dry_run }}

  publish-docker-hub:
    name: Publish to Docker Hub
    needs: [setup, track-a-layer-3]
    if: needs.track-a-layer-3.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      result_json: ${{ steps.publish.outputs.result_json }}
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish via composite action
        id: publish
        uses: ./actions/publish-docker-hub
        with:
          mcp_name: ${{ needs.setup.outputs.mcp_name }}
          version: ${{ needs.setup.outputs.version }}
          pipeline_run_id: ${{ needs.setup.outputs.pipeline_run_id }}
          dry_run: ${{ needs.setup.outputs.dry_run }}

  publish-mcp-registry:
    name: Publish to MCP Official Registry
    # mcp-registry depends on publish-npm because the registry's package-
    # ownership verification reads the mcpName field from the npm package.
    # We need the package to be live first. Use always() so a failed npm
    # publish doesn't silently skip this — the dependency expresses order,
    # not blocking semantics, and the conditional below adds the gate.
    needs: [setup, track-a-layer-3, publish-npm]
    if: |
      always()
      && needs.track-a-layer-3.result == 'success'
      && contains(fromJson(needs.publish-npm.outputs.result_json || '{"status":"failed"}').status, 'succeeded')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      result_json: ${{ steps.publish.outputs.result_json }}
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish via composite action
        id: publish
        uses: ./actions/publish-mcp-registry
        with:
          mcp_name: ${{ needs.setup.outputs.mcp_name }}
          version: ${{ needs.setup.outputs.version }}
          pipeline_run_id: ${{ needs.setup.outputs.pipeline_run_id }}
          dry_run: ${{ needs.setup.outputs.dry_run }}

  # ---------------------------------------------------------------------
  # Epic 4 publishers (Stories 4.2 / 4.3 / 4.4 / 4.5)
  # Independent of each other — run in parallel after the gates pass.
  # All 4 are non-blocking for the npm/Docker/MCP-Registry "core 3" path.
  # ---------------------------------------------------------------------

  publish-smithery:
    name: Publish to Smithery
    needs: [setup, track-a-layer-3]
    if: needs.track-a-layer-3.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      result_json: ${{ steps.publish.outputs.result_json }}
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish via composite action
        id: publish
        uses: ./actions/publish-smithery
        with:
          mcp_name: ${{ needs.setup.outputs.mcp_name }}
          version: ${{ needs.setup.outputs.version }}
          pipeline_run_id: ${{ needs.setup.outputs.pipeline_run_id }}
          dry_run: ${{ needs.setup.outputs.dry_run }}

  publish-docker-mcp-catalog:
    name: Publish to Docker MCP Catalog
    needs: [setup, track-a-layer-3]
    if: needs.track-a-layer-3.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      result_json: ${{ steps.publish.outputs.result_json }}
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
      BOT_PAT: ${{ secrets.BOT_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish via composite action
        id: publish
        uses: ./actions/publish-docker-mcp-catalog
        with:
          mcp_name: ${{ needs.setup.outputs.mcp_name }}
          version: ${{ needs.setup.outputs.version }}
          pipeline_run_id: ${{ needs.setup.outputs.pipeline_run_id }}
          dry_run: ${{ needs.setup.outputs.dry_run }}

  publish-cline:
    name: Publish to Cline Marketplace
    needs: [setup, track-a-layer-3]
    if: needs.track-a-layer-3.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      result_json: ${{ steps.publish.outputs.result_json }}
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
      BOT_PAT: ${{ secrets.BOT_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish via composite action
        id: publish
        uses: ./actions/publish-cline
        with:
          mcp_name: ${{ needs.setup.outputs.mcp_name }}
          version: ${{ needs.setup.outputs.version }}
          pipeline_run_id: ${{ needs.setup.outputs.pipeline_run_id }}
          dry_run: ${{ needs.setup.outputs.dry_run }}

  publish-mcpso:
    name: Publish to mcp.so
    needs: [setup, track-a-layer-3]
    if: needs.track-a-layer-3.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      result_json: ${{ steps.publish.outputs.result_json }}
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
      BOT_PAT: ${{ secrets.BOT_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish via composite action
        id: publish
        uses: ./actions/publish-mcpso
        with:
          mcp_name: ${{ needs.setup.outputs.mcp_name }}
          version: ${{ needs.setup.outputs.version }}
          pipeline_run_id: ${{ needs.setup.outputs.pipeline_run_id }}
          dry_run: ${{ needs.setup.outputs.dry_run }}

  # ---------------------------------------------------------------------
  # Story 3.8: npx install-path verification (FR47).
  # Runs `npx -y @g-digital/mcp-<name>@<version>` as a fresh process and
  # does the MCP initialize + tools/list handshake to confirm the
  # consumer install path actually works. Gated on publish-npm success
  # so we never npx-install a version that didn't actually publish.
  # ---------------------------------------------------------------------

  npx-verification:
    name: npx install-path verification
    needs: [setup, publish-npm]
    if: |
      needs.publish-npm.result == 'success'
      && needs.setup.outputs.dry_run != 'true'
      && fromJson(needs.publish-npm.outputs.result_json).status == 'succeeded'
    runs-on: ubuntu-latest
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pipeline dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify npx install path (initialize + tools/list)
        run: |
          set -euo pipefail
          pnpm tsx src/ci/verify-npx-install.ts \
            "${{ needs.setup.outputs.mcp_name }}" \
            "${{ needs.setup.outputs.version }}" \
            | tee npx-verification.json

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npx-verification-${{ needs.setup.outputs.mcp_name }}-v${{ needs.setup.outputs.version }}
          path: npx-verification.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Story 3.7: final-report job — aggregates Track A publishers,
  # commits the release report, and upserts the PR comment.
  # Always runs so partial-publish + full-failure cases still get a report.
  # ---------------------------------------------------------------------

  final-report:
    name: Final release report
    needs:
      - setup
      - publish-npm
      - publish-docker-hub
      - publish-mcp-registry
      - publish-smithery
      - publish-docker-mcp-catalog
      - publish-cline
      - publish-mcpso
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit the markdown report
      pull-requests: write   # upsert the PR comment
    env:
      PIPELINE_RUN_ID: ${{ needs.setup.outputs.pipeline_run_id }}
      DRY_RUN: ${{ needs.setup.outputs.dry_run }}
      MCP_NAME: ${{ needs.setup.outputs.mcp_name }}
      VERSION: ${{ needs.setup.outputs.version }}
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need full history so the commit-and-push step can rebase
          # against any concurrent commits on main / the PR branch.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pipeline dependencies
        run: pnpm install --frozen-lockfile

      - name: Render release report
        env:
          # The result_json output is a JSON object string; we collect them
          # one per line so the render script can JSON-parse each line.
          # Use '{"status":"failed",...}' fallback when a publisher job was
          # skipped (e.g. mcp-registry skipped because publish-npm failed)
          # so the report still renders a row for it.
          PUBLISHER_RESULTS_JSON: |
            ${{ needs.publish-npm.outputs.result_json || format('{{"target":"npm","status":"failed","target_url":"https://example.invalid/skipped/npm","version_published":null,"duration_ms":0,"attempts":1,"dry_run":{0},"error":{{"message":"publish-npm job did not run (skipped or pre-empted by upstream failure).","cause":"Upstream gate or dependency was not successful.","action":"Inspect the workflow run; re-run after fixing the upstream gate."}}}}', needs.setup.outputs.dry_run) }}
            ${{ needs.publish-docker-hub.outputs.result_json || format('{{"target":"docker-hub","status":"failed","target_url":"https://example.invalid/skipped/docker-hub","version_published":null,"duration_ms":0,"attempts":1,"dry_run":{0},"error":{{"message":"publish-docker-hub job did not run.","cause":"Upstream gate or dependency was not successful.","action":"Inspect the workflow run; re-run after fixing the upstream gate."}}}}', needs.setup.outputs.dry_run) }}
            ${{ needs.publish-mcp-registry.outputs.result_json || format('{{"target":"mcp-publisher","status":"failed","target_url":"https://example.invalid/skipped/mcp-publisher","version_published":null,"duration_ms":0,"attempts":1,"dry_run":{0},"error":{{"message":"publish-mcp-registry job did not run.","cause":"Upstream npm publish did not succeed.","action":"Re-run /retry-publish?step=mcp-publisher after npm succeeds."}}}}', needs.setup.outputs.dry_run) }}
            ${{ needs.publish-smithery.outputs.result_json || format('{{"target":"smithery","status":"failed","target_url":"https://example.invalid/skipped/smithery","version_published":null,"duration_ms":0,"attempts":1,"dry_run":{0},"error":{{"message":"publish-smithery job did not run.","cause":"Upstream gate or dependency was not successful.","action":"Inspect the workflow run; re-run after fixing the upstream gate."}}}}', needs.setup.outputs.dry_run) }}
            ${{ needs.publish-docker-mcp-catalog.outputs.result_json || format('{{"target":"docker-mcp-catalog","status":"failed","target_url":"https://example.invalid/skipped/docker-mcp-catalog","version_published":null,"duration_ms":0,"attempts":1,"dry_run":{0},"error":{{"message":"publish-docker-mcp-catalog job did not run.","cause":"Upstream gate or dependency was not successful.","action":"Inspect the workflow run; re-run after fixing the upstream gate."}}}}', needs.setup.outputs.dry_run) }}
            ${{ needs.publish-cline.outputs.result_json || format('{{"target":"cline","status":"failed","target_url":"https://example.invalid/skipped/cline","version_published":null,"duration_ms":0,"attempts":1,"dry_run":{0},"error":{{"message":"publish-cline job did not run.","cause":"Upstream gate or dependency was not successful.","action":"Inspect the workflow run; re-run after fixing the upstream gate."}}}}', needs.setup.outputs.dry_run) }}
            ${{ needs.publish-mcpso.outputs.result_json || format('{{"target":"mcpso","status":"failed","target_url":"https://example.invalid/skipped/mcpso","version_published":null,"duration_ms":0,"attempts":1,"dry_run":{0},"error":{{"message":"publish-mcpso job did not run.","cause":"Upstream gate or dependency was not successful.","action":"Inspect the workflow run; re-run after fixing the upstream gate."}}}}', needs.setup.outputs.dry_run) }}
        run: |
          set -euo pipefail
          pnpm tsx src/ci/render-release-report.ts > /dev/null

      - name: Upload release-report artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-report-${{ needs.setup.outputs.mcp_name }}-v${{ needs.setup.outputs.version }}
          path: _bmad-output/release-reports/${{ needs.setup.outputs.mcp_name }}-v${{ needs.setup.outputs.version }}.md
          if-no-files-found: error

      - name: Commit + push release-report to main
        # NEVER commit in dry-run mode; the workflow artifact above is the
        # only output. Same when there is no PR (manual dispatch off main)
        # but we still want to land the file on main.
        if: needs.setup.outputs.dry_run != 'true'
        env:
          REPORT_PATH: _bmad-output/release-reports/${{ needs.setup.outputs.mcp_name }}-v${{ needs.setup.outputs.version }}.md
        run: |
          set -euo pipefail
          git config user.name "g-digital-mcp-bot"
          git config user.email "g-digital-mcp-bot@users.noreply.github.com"
          git add "$REPORT_PATH"
          if git diff --staged --quiet; then
            echo "No changes to release report — nothing to commit."
            exit 0
          fi
          git commit -m "docs(release): ${MCP_NAME} v${VERSION} release report"
          # Rebase any concurrent commits in case another run landed
          # something while this one was in flight.
          git pull --rebase origin "${GITHUB_REF_NAME}" || git pull --rebase origin main
          git push

      - name: Upsert PR comment with release report
        if: needs.setup.outputs.dry_run != 'true'
        uses: actions/github-script@v7
        env:
          MCP_NAME: ${{ needs.setup.outputs.mcp_name }}
          VERSION: ${{ needs.setup.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const mcpName = process.env.MCP_NAME;
            const version = process.env.VERSION;
            const reportPath = `_bmad-output/release-reports/${mcpName}-v${version}.md`;
            const body = fs.readFileSync(reportPath, 'utf8');
            const marker = `<!-- release-report:${mcpName}-v${version} -->`;

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pr = prs[0];
            if (!pr) {
              core.notice('No PR associated with this commit; release report posted only as artifact + main commit.');
              core.summary.addRaw(body).write();
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.notice(`Updated release-report comment on PR #${pr.number}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
              core.notice(`Posted release-report comment on PR #${pr.number}.`);
            }
            core.summary.addRaw(body).write();
